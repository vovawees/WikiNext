name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgresql:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: wikinext
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: wikinext-bootstrap-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wikinext"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      meilisearch:
        image: getmeili/meilisearch:v1.45.1@sha256:ac40212f9e5a7526d8007586e3e46fb0441d29dd36c7b02fa2341d2c9a1f6493
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: wikinext-ci-master-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-deny,cargo-audit
          fallback: none

      - run: cargo fmt --all --check

      - run: python3 scripts/check_architecture.py

      - run: python3 scripts/check_ftml_contract.py

      - run: cargo check --workspace --all-targets --all-features --locked

      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - run: cargo test --workspace --all-targets --locked

      - run: cargo test --workspace --doc --locked

      - name: Security and compatibility contracts
        run: |
          cargo test -p wikinext-core policy --locked
          cargo test -p wikinext-render --locked

      - run: cargo build --workspace --release --locked

      - run: cargo deny check

      - run: cargo audit

      - name: Wait for Meilisearch
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7700/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Bootstrap least-privilege application role
        env:
          PGPASSWORD: wikinext-bootstrap-ci-password
        run: >-
          psql
          --host=127.0.0.1
          --username=postgres
          --dbname=wikinext
          --set=ON_ERROR_STOP=1
          --file=ops/postgres/init.sql

      - name: Apply migrations as DDL role
        env:
          WIKINEXT_CONFIG: config.example.toml
          WIKINEXT_DATABASE_URL: postgres://wikinext_app:wikinext-app-dev-password@127.0.0.1:5432/wikinext
          WIKINEXT_DATABASE_MIGRATION_URL: postgres://wikinext_migrator:wikinext-migrator-dev-password@127.0.0.1:5432/wikinext
        run: cargo run --locked -- migrate

      - name: Assert application role remains least-privilege
        env:
          PGPASSWORD: wikinext-app-dev-password
        run: |
          psql --host=127.0.0.1 --username=wikinext_app --dbname=wikinext \
            --set=ON_ERROR_STOP=1 \
            --command="SELECT version FROM public.wikinext_schema_state WHERE component = 'database'"
          if psql --host=127.0.0.1 --username=wikinext_app --dbname=wikinext \
            --set=ON_ERROR_STOP=1 \
            --command="CREATE TABLE public.wikinext_forbidden_probe (id integer)"; then
            echo "application role unexpectedly has DDL privileges" >&2
            exit 1
          fi
          if psql --host=127.0.0.1 --username=wikinext_app --dbname=wikinext \
            --set=ON_ERROR_STOP=1 \
            --command="INSERT INTO public.wikinext_schema_state (component, version) VALUES ('forbidden', 1)"; then
            echo "application role unexpectedly has write privileges on schema state" >&2
            exit 1
          fi
          if psql --host=127.0.0.1 --username=wikinext_app --dbname=wikinext \
            --set=ON_ERROR_STOP=1 \
            --command="SELECT version FROM public._sqlx_migrations LIMIT 1"; then
            echo "application role unexpectedly reads migration internals" >&2
            exit 1
          fi

      - name: Run doctor as application role
        env:
          WIKINEXT_CONFIG: config.example.toml
          WIKINEXT_DATABASE_URL: postgres://wikinext_app:wikinext-app-dev-password@127.0.0.1:5432/wikinext
          WIKINEXT_MEILISEARCH_API_KEY: wikinext-ci-master-key
          WIKINEXT_DATA_DIR: ./target/ci-data
        run: cargo run --locked -- doctor
