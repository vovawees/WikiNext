services:
  postgresql:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: wikinext
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wikinext-bootstrap-dev-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/010-wikinext.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wikinext"]
      interval: 2s
      timeout: 3s
      retries: 30

  meilisearch:
    image: getmeili/meilisearch:v1.45.1@sha256:ac40212f9e5a7526d8007586e3e46fb0441d29dd36c7b02fa2341d2c9a1f6493
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: wikinext-development-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgresql-data:
  meilisearch-data:
